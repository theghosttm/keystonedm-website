<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeystoneDM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#050505;color:#fff;overflow-x:hidden}

/* ===== Background Glow ===== */
body::before{
content:"";
position:fixed;
top:-20%;left:-20%;
width:140%;height:140%;
background:
radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08), transparent 40%),
radial-gradient(circle at 70% 60%, rgba(255,255,255,0.05), transparent 45%),
radial-gradient(circle at 50% 80%, rgba(255,255,255,0.04), transparent 50%);
z-index:-1;
filter:blur(60px);
}

/* ===== HEADER ===== */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
position:fixed;
width:100%;
top:0;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(12px);
z-index:100;
border-bottom:1px solid rgba(255,255,255,0.05)
}

/* ===== LOGO AREA ===== */
.logo{
display:flex;
align-items:center;
gap:12px;
font-weight:800;
font-size:20px;
}

/* wrapper */
.logo-wrapper{
position:relative;
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
}

/* YOUR LOGO IMAGE */
.logo-img{
width:34px;
height:34px;
object-fit:contain;

/* KEY UNLOCK ANIMATION */
opacity:0;
transform:rotate(-90deg) scale(0.6);
animation: unlockKey 1.4s ease-out forwards;

filter: drop-shadow(0 0 0 rgba(255,255,255,0));
}

/* LOCK RING */
.lock-ring{
position:absolute;
width:40px;
height:40px;
border-radius:50%;
border:2px solid rgba(255,255,255,0.25);
opacity:0;
transform:scale(0.3);
animation: ringUnlock 1.4s ease-out forwards;
}

/* TEXT */
.logo-text{
opacity:0;
transform:translateX(-6px);
animation: textIn 1s ease forwards;
animation-delay:1.1s;
}

/* ===== KEY ANIMATION ===== */
@keyframes unlockKey{
0%{
opacity:0;
transform:rotate(-90deg) scale(0.6);
}
50%{opacity:1;}
80%{
transform:rotate(10deg) scale(1.1);
filter: drop-shadow(0 0 12px rgba(255,255,255,0.3));
}
100%{
opacity:1;
transform:rotate(0deg) scale(1);
filter: drop-shadow(0 0 10px rgba(255,255,255,0.25));
}
}

/* ring effect */
@keyframes ringUnlock{
0%{opacity:0;transform:scale(0.3);}
40%{opacity:1;}
70%{transform:scale(1.2);border-color:rgba(255,255,255,0.5);}
100%{opacity:0;transform:scale(1.6);}
}

@keyframes textIn{
to{opacity:1;transform:translateX(0);}
}

/* NAV */
nav a{margin:0 15px;text-decoration:none;color:#aaa;transition:.3s}
nav a:hover{color:#fff}

.btn{
padding:10px 18px;
border:1px solid #333;
border-radius:10px;
color:#fff;
text-decoration:none;
transition:.3s;
background:rgba(255,255,255,0.02)
}
.btn:hover{background:#fff;color:#000}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:0 20px
}

.hero h1{
font-size:64px;
font-weight:800;
background:linear-gradient(to bottom,#fff,#888);
-webkit-background-clip:text;
color:transparent
}

.hero p{margin-top:20px;color:#aaa;max-width:600px}
.hero-buttons{margin-top:30px}

/* SECTIONS */
.section{padding:100px 60px}
.section h2{font-size:40px;margin-bottom:20px}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:30px
}

.card{
background:rgba(255,255,255,0.02);
padding:25px;
border-radius:15px;
border:1px solid rgba(255,255,255,0.06);
transition:.3s;
}
.card:hover{transform:translateY(-6px)}

.footer{
padding:40px;
text-align:center;
color:#888;
border-top:1px solid #111
}

/* fade */
.fade{opacity:0;transform:translateY(25px);transition:1s}
.fade.show{opacity:1;transform:translateY(0)}
</style>
</head>

<body>

<header>

<div class="logo">

  <div class="logo-wrapper">
    <img src="./keystonedmlogo.png" class="logo-img" alt="KeystoneDM Logo">
    <div class="lock-ring"></div>
  </div>

  <span class="logo-text">KeystoneDM</span>

</div>

<nav>
<a href="#home">Home</a>
<a href="#services">Services</a>
<a href="#pricing">Pricing</a>
<a href="#contact">Contact</a>
</nav>

<a href="#login" class="btn">Login</a>
</header>

<section class="hero fade" id="home">
<h1>Every Site.<br>Every Client.</h1>
<p>We build clean, modern, high-converting websites for businesses.</p>
<div class="hero-buttons">
<a href="#services" class="btn">Get Started</a>
</div>
</section>

<section class="section fade" id="services">
<h2>Services</h2>
<div class="cards">
<div class="card"><h3>Web Design</h3></div>
<div class="card"><h3>SEO</h3></div>
<div class="card"><h3>Branding</h3></div>
</div>
</section>

<section class="section fade" id="contact">
<h2>Contact</h2>
<p>📞 (314) 329-4503<br>📧 drakewallace12486@gmail.com</p>
</section>

<div class="footer">© 2026 KeystoneDM</div>

<script>
const faders=document.querySelectorAll('.fade');
const observer=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting)e.target.classList.add('show');
});
},{threshold:0.2});
faders.forEach(f=>observer.observe(f));
</script>

</body>
</html>
